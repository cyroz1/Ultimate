name: Build and release Ultimate UI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.8"
        required: true
        default: "0.1.8"

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: powershell
        run: |
          $parseErrors = @()
          Get-ChildItem -Path . -Filter *.ps1 -File -Recurse |
            Where-Object { $_.FullName -notmatch '[\\/]ui[\\/]' -and $_.FullName -notmatch '[\\/]build[\\/]' } |
            ForEach-Object {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) {
                $parseErrors += "$( $_.FullName ): $($errors[0].Message)"
              }
            }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            throw "PowerShell syntax validation failed."
          }

      - name: Validate build and UI host syntax
        shell: powershell
        run: |
          $files = @('.\build\build.ps1', '.\ui\PowerShellHost.ps1', '.\ui\UltimateArchitecture.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              throw "PowerShell syntax validation failed for $file`: $($errors[0].Message)"
            }
          }

  build-release:
    needs: validate
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install WiX Toolset
        shell: powershell
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix --version

      - name: Build ${{ matrix.architecture }} installer and script bundle
        shell: powershell
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_VERSION: ${{ github.ref_name }}
          TARGET_ARCH: ${{ matrix.architecture }}
        run: |
          $version = $env:INPUT_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = $env:REF_VERSION -replace '^v', ''
          }
          .\build\build.ps1 -Version $version -Architecture $env:TARGET_ARCH

      - name: Upload ${{ matrix.architecture }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-UI-${{ matrix.architecture }}
          path: |
            dist/*.msi
            dist/*.zip
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-release
    runs-on: windows-latest
    steps:
      - name: Download architecture artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish tagged release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem .\release-assets -File | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) {
            throw "No release assets were downloaded."
          }
          gh release create $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --generate-notes
