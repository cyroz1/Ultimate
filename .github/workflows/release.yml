name: Build and release Ultimate UI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.0"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install WiX Toolset
        shell: powershell
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix --version

      - name: Validate PowerShell syntax
        shell: powershell
        run: |
          $parseErrors = @()
          Get-ChildItem -Path . -Filter *.ps1 -File -Recurse |
            Where-Object { $_.FullName -notmatch '[\\/]ui[\\/]' -and $_.FullName -notmatch '[\\/]build[\\/]' } |
            ForEach-Object {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) {
                $parseErrors += "$( $_.FullName ): $($errors[0].Message)"
              }
            }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            throw "PowerShell syntax validation failed."
          }

      - name: Validate UI host syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('.\ui\PowerShellHost.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            throw "UI host syntax validation failed: $($errors[0].Message)"
          }

      - name: Build native Windows installer
        shell: powershell
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:INPUT_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = $env:REF_VERSION -replace '^v', ''
          }
          .\build\build.ps1 -Version $version

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-UI-installer
          path: dist/*.msi

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = Get-ChildItem .\dist\*.msi | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME $asset.FullName --repo $env:GITHUB_REPOSITORY --generate-notes
